name: contracts

# CF-22 P1 — the product-compat surface is a committed, generated artifact.
# These gates fail the build when the vendored product contract drifts, the
# framework's emitted spec goes stale, or an implemented op diverges from the
# product shape. The drift gate's burn-down table IS P2's worklist.
#
# - spec-staleness: framework.openapi.json must match a fresh emission.
# - drift-gate:     0 missing ops, 0 divergent implemented ops (stubs are the
#                   burn-down, not a failure).
# - test:           the full backend suite incl. compat-variables (proof tag) and
#                   contract-diff (the gate + its mutation proof).
#
# Since consolidation phase 1 the console is framework source: the artifact is
# built and staged in-repo (`pnpm console:build`), validated structurally
# (`pnpm console:check`), and the browser acceptance gate runs on every push.
# (Pre-consolidation the acceptance gate keyed on hashFiles of gitignored
# console bundles, which is always empty on a fresh checkout — the browser
# gate silently never ran in CI. That coverage hole is closed here.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build
      # Build + stage the console artifact from in-repo source (also verifies
      # the staged tree structurally — shell ↔ bundle agreement, builder-sw.js).
      - name: Console artifact (build + stage)
        run: pnpm console:build
      - name: Console artifact gate
        run: pnpm console:check
      # The deployable Worker, exercised in-process against a memory runner.
      - name: cf-full smoke (deployable worker)
        run: pnpm --filter @frontbase/example-cf-full smoke
      - name: Console artifact guarantees
        run: node examples/cf-full/test/console-pin.mjs
      # Gate 4: the console in a real browser against the real Worker on workerd.
      # This catches what in-process gates structurally cannot — the console calls
      # paths the contract does not declare verbatim, and only a browser sees that.
      # Unconditional since the console moved in-repo: the artifact is always
      # staged by the step above.
      - name: Console acceptance (browser)
        run: |
          npx playwright install --with-deps chromium
          pnpm --filter @frontbase/example-cf-full e2e
      - name: Upload acceptance failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            examples/cf-full/e2e/report
            examples/cf-full/e2e/test-results
          if-no-files-found: ignore
      - name: Spec staleness gate
        run: pnpm --filter @frontbase/backend run contracts:check
      - name: Contract drift gate (missing / divergent)
        run: pnpm run contracts:diff
      # Includes compat-conformance --gate: every documented 2xx response is
      # validated against the vendored Zod. Unlike the drift gate (which compares
      # the contract to itself) this fails when a HANDLER diverges.
      - name: Backend suite (incl. compat-variables, contract-diff, conformance)
        run: pnpm --filter @frontbase/backend test
      - name: Mutation gates
        run: pnpm -r test:mutation
