name: Contract Drift

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      prove_failure:
        description: Deliberately dirty the product contract and prove the gate goes RED
        required: false
        default: false
        type: boolean

concurrency:
  group: cf22-contract-drift
  cancel-in-progress: false

jobs:
  check-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: framework
          persist-credentials: false

      - name: Require read-only product credential
        env:
          PRODUCT_REPO_TOKEN: ${{ secrets.PRODUCT_REPO_TOKEN }}
        run: |
          if [ -z "$PRODUCT_REPO_TOKEN" ]; then
            echo "::error::PRODUCT_REPO_TOKEN is required for the private product checkout."
            exit 1
          fi

      - name: Checkout product main
        uses: actions/checkout@v4
        with:
          repository: drmoyassine/frontbase-dbsync
          ref: main
          fetch-depth: 1
          path: product
          token: ${{ secrets.PRODUCT_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.15.1'

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: product/fastapi-backend/requirements.txt

      - name: Install product exporter dependencies
        working-directory: product/fastapi-backend
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements.txt
          python - <<'PY'
          from importlib.metadata import version
          actual = version("fastapi")
          if actual != "0.139.0":
              raise SystemExit(f"expected fastapi 0.139.0, got {actual}")
          print(f"FastAPI exporter pin: {actual}")
          PY

      - name: Regenerate and verify committed product contract
        working-directory: product/fastapi-backend
        env:
          PYTHONHASHSEED: '0'
        run: python scripts/export_openapi.py --check

      - name: Prove product generated artifacts are clean
        run: |
          if [ -n "$(git -C product status --porcelain -- fastapi-backend/contracts src/client/zod.gen.ts)" ]; then
            echo "::error::Product-generated OpenAPI/Zod artifacts differ from product main."
            git -C product status --short -- fastapi-backend/contracts src/client/zod.gen.ts
            git -C product diff -- fastapi-backend/contracts src/client/zod.gen.ts
            exit 1
          fi

      - name: Inject deliberate drift proof
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prove_failure }}
        run: |
          printf '\n' >> product/fastapi-backend/contracts/openapi.community.json
          echo "Injected a product-side generated-artifact change. The provenance gate below must fail."

      - name: Create isolated replay checkouts
        run: |
          FRAMEWORK_REPLAY="$RUNNER_TEMP/framework-contract-drift"
          PRODUCT_CONSOLE_REPLAY="$RUNNER_TEMP/product-console-drift"
          git clone --no-hardlinks "$GITHUB_WORKSPACE/framework" "$FRAMEWORK_REPLAY"
          git -C product worktree add --detach "$PRODUCT_CONSOLE_REPLAY" HEAD
          echo "FRAMEWORK_REPLAY=$FRAMEWORK_REPLAY" >> "$GITHUB_ENV"
          echo "PRODUCT_CONSOLE_REPLAY=$PRODUCT_CONSOLE_REPLAY" >> "$GITHUB_ENV"

      - name: Replay contract sync from product main
        run: |
          PRODUCT_SHA="$(git -C product rev-parse --verify 'HEAD^{commit}')"
          node framework/scripts/sync-contract.mjs \
            --framework "$FRAMEWORK_REPLAY" \
            --product "$GITHUB_WORKSPACE/product" \
            --commit "$PRODUCT_SHA"

      - name: Rebuild console deterministically
        env:
          FRONTBASE_FRAMEWORK: ${{ env.FRAMEWORK_REPLAY }}
        run: |
          node framework/scripts/pin-console-build-time.mjs \
            --product "$PRODUCT_CONSOLE_REPLAY" \
            --pin "$FRAMEWORK_REPLAY/examples/cf-full/console-dist/CONSOLE_PIN"
          # Build the framework's edge-core first so the product's builderSwPlugin
          # can resolve @frontbase/edge-core (via FRONTBASE_FRAMEWORK env).
          pnpm --dir "$FRAMEWORK_REPLAY" install --frozen-lockfile
          pnpm --dir "$FRAMEWORK_REPLAY" --filter @frontbase/edge-core... run build
          npm ci --prefix "$PRODUCT_CONSOLE_REPLAY"
          npm --prefix "$PRODUCT_CONSOLE_REPLAY" run build:community
          node "$FRAMEWORK_REPLAY/scripts/fetch-console.mjs" \
            --product-dir "$PRODUCT_CONSOLE_REPLAY" \
            --skip-build

      - name: Install replay dependencies
        run: pnpm --dir "$FRAMEWORK_REPLAY" install --frozen-lockfile

      - name: Regenerate framework contract and run zero-drift gates
        run: |
          pnpm --dir "$FRAMEWORK_REPLAY" --filter @frontbase/backend run contracts:emit
          pnpm --dir "$FRAMEWORK_REPLAY" run contracts:diff
          pnpm --dir "$FRAMEWORK_REPLAY" run console:check
          node "$FRAMEWORK_REPLAY/scripts/check-scheduled-drift.mjs" \
            --framework "$FRAMEWORK_REPLAY" \
            --product "$GITHUB_WORKSPACE/product" \
            --console-dist "$PRODUCT_CONSOLE_REPLAY/dist"

      - name: Assert replay produced zero tracked changes
        run: |
          STATUS="$(git -C "$FRAMEWORK_REPLAY" status --porcelain -- \
            packages/backend/contracts \
            packages/backend/src/compat/zod.gen.ts \
            packages/backend/src/compat/community-spec.ts \
            examples/cf-full/console-dist)"
          if [ -n "$STATUS" ]; then
            echo "::error::Scheduled cross-repository drift detected."
            printf '%s\n' "$STATUS"
            git -C "$FRAMEWORK_REPLAY" diff -- \
              packages/backend/contracts \
              packages/backend/src/compat/zod.gen.ts \
              packages/backend/src/compat/community-spec.ts \
              examples/cf-full/console-dist
            exit 1
          fi
          echo "Product contract, framework surface, pins, and rebuilt console are in sync."

      - name: Open or update one drift issue
        if: ${{ failure() && !(github.event_name == 'workflow_dispatch' && inputs.prove_failure) }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: framework
        run: |
          LABEL="cf-22-contract-drift"
          TITLE="Scheduled CF-22 contract drift detected"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create "$LABEL" \
            --description "Automated cross-repository contract drift" \
            --color "B60205" \
            --force
          EXISTING="$(gh issue list \
            --state open \
            --label "$LABEL" \
            --json number,createdAt \
            --jq 'sort_by(.createdAt) | .[0].number // empty')"
          BODY="The scheduled CF-22 drift replay failed for product main. Run: $RUN_URL"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi

      - name: Close resolved drift issue
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: framework
        run: |
          LABEL="cf-22-contract-drift"
          EXISTING="$(gh issue list \
            --state open \
            --label "$LABEL" \
            --json number,createdAt \
            --jq 'sort_by(.createdAt) | .[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --comment "Resolved by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
