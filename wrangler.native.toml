# Opt-in zero-resource hosted setup. The operator supplies an approved OAuth
# relay before publishing a native-button source snapshot. No credentials here.
name = "frontbase-selfhost"
main = "examples/cf-full/dist/worker.mjs"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
no_bundle = true
find_additional_modules = true
base_dir = "./examples/cf-full/dist"
[[rules]]
type = "ESModule"
globs = ["pg-worker.mjs"]
fallthrough = true
[assets]
directory = "./examples/cf-full/console-dist"
binding = "ASSETS"
run_worker_first = true
[observability]
enabled = false
[vars]
FRONTBASE_BOOTSTRAP = "native"
FRONTBASE_NATIVE_RELAY_URL = ""
