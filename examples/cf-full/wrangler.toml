name = "frontbase-selfhost-fullcms"
main = "dist/worker.mjs"
compatibility_date = "2026-01-01"
no_bundle = true

# Product community console. Exact files under /frontbase-admin/* are served
# before the Worker; API, eSSR, SW, and unmatched SPA navigation routes fall
# through to the Worker. The staged directory mirrors the URL prefix.
[assets]
directory = "./console-dist"
binding = "ASSETS"
run_worker_first = true

# Single pre-bundled artifact (SW inlined, console + D1 runner bundled). No
# nodejs_compat: the whole request path is Web-standard (Web Crypto for PBKDF2 +
# HS256, D1 binding for storage).

# Observability ON by default — persists console.log/error + invocation logs to
# the CF dashboard so a runtime error is inspectable without a live `wrangler tail`.
[observability]
enabled = true

[observability.logs]
invocation_logs = true

# Storage: a Cloudflare D1 database bound as env.DB. `frontbase deploy` provisions
# and writes the database_id; or create it manually (see README) and paste it here.
[[d1_databases]]
binding = "DB"
database_name = "xyzz-db"
database_id = "252c388a-cfe5-4b86-9890-f7102afc6bbd"

# Secrets are NOT stored here (they'd land in git). Set them with:
#   wrangler secret put SESSION_SECRET     (required)
#   wrangler secret put SETUP_TOKEN        (optional — enables /setup)
#   wrangler secret put SETUP_EXPIRES_AT   (recommended ISO expiry for /setup)
#   wrangler secret put ADMIN_EMAIL        (optional — seed first owner)
#   wrangler secret put ADMIN_PASSWORD     (optional)
#   wrangler secret put ADMIN_ROLE         (optional — default 'master_admin')
# …or let `deploy:cf-full` generate a short-lived setup link automatically.
